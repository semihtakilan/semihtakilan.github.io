<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartavia Duel</title>
<meta name="description" content="Cartavia Duel davet kodu · Cartavia Duel invitation code">
<style>
  :root { --table: #1A1714; --cream: #EFE6D4; --muted: #B9A987; --gold: #D4B36A; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--table); color: var(--cream); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-weight: 500; letter-spacing: .2em; margin: 0 0 8px; font-size: 20px; }
  .code { font-size: 44px; letter-spacing: .3em; color: var(--gold); margin: 16px 0 4px; font-variant-numeric: tabular-nums; }
  p { color: var(--muted); margin: 8px 0; }
  a { color: var(--gold); }
  .button { display: inline-block; margin: 14px 8px 0; padding: 12px 22px; border: 1px solid var(--gold); border-radius: 999px; text-decoration: none; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>CARTAVIA · DUEL</h1>
  <p id="invite">Arkadaşın seni bir düelloya çağırıyor.<br>A friend is inviting you to a duel.</p>
  <div class="code" id="code"></div>
  <p id="hint" class="hidden">Cartavia’da Duel → Arkadaşla → Koda katıl ve bu kodu yaz.<br>In Cartavia: Duel → With a friend → Join with a code, and type this code.</p>
  <p><a id="open" class="button hidden" href="#">Uygulamada aç · Open in the app</a></p>
  <p>
    <a class="button" href="https://play.google.com/store/apps/details?id=com.semihtakilan.cartavia">Google Play</a>
    <a class="button" href="https://apps.apple.com/app/id6828195639">App Store</a>
  </p>
  <p><a href="../../">Cartavia</a></p>
</main>
<script>
  // The code comes from ?k=; the app's own scheme opens straight into the room when it is installed. Nothing is sent anywhere.
  var alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var raw = (new URLSearchParams(location.search).get("k") || "").toUpperCase().replace(/[\s-]/g, "");
  var ok = raw.length === 6 && raw.split("").every(function (c) { return alphabet.indexOf(c) >= 0; });
  if (ok) {
    document.getElementById("code").textContent = raw.split("").join(" ");
    document.getElementById("hint").classList.remove("hidden");
    var open = document.getElementById("open"); open.href = "cartavia://duel?k=" + raw; open.classList.remove("hidden");
  } else {
    document.getElementById("invite").textContent = "Bu bağlantıda bir oda kodu yok. · This link carries no room code.";
  }
</script>
</body>
</html>
